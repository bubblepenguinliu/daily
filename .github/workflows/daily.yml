name: daily-digest

# 每天北京时间 09:00 在 GitHub 服务器上：
#   抓取 → AI 分析 → 生成 HTML 日报 → 提交回仓库 → 发布到 GitHub Pages
#
# 【需要的仓库设置】
#   1. Settings → Secrets and variables → Actions → New repository secret
#      名字用 Deepseek_Daily_Report 或 AI_API_KEY 都可以（下面两个都认，前者优先）
#   2. Settings → Actions → General → 底部 Workflow permissions
#      选 "Read and write permissions"
#   3. Settings → Pages → Source 选 "GitHub Actions"（新版界面默认就是这个）

on:
  schedule:
    # ⚠️ 刻意【避开整点】。GitHub 官方文档明确写着：整点是调度高峰，
    #    "if the load is sufficiently high enough, some queued jobs may be dropped"
    #    —— 排队任务可能被**直接丢弃**，不是延迟，是消失。
    # 2026-09-30 实测教训：原来配成 `0 1 * * *`（正好整点），
    #    当天 09:00 那一次定时**被跳过**，event=schedule 运行记录 0 条。
    #    现在改成 09:17 主 + 10:47 备用（错开分钟，且备用点兜底主点被丢的情况）。
    - cron: "17 1 * * *"   # UTC 01:17 = 北京时间 09:17（主）
    - cron: "47 2 * * *"   # UTC 02:47 = 北京时间 10:47（备用兜底）
  workflow_dispatch:        # 网页上「Run workflow」手动触发
  push:
    branches: [ main ]
    # 机器人自己提交的日报/状态变化不算"代码变更"，不触发新一轮，避免死循环。
    # 也就是说：改了 src/ config/ workflow 才会自动跑一次，日报提交不会。
    paths-ignore:
      - "output/**"
      - "state/**"
      - "README.md"
      - "index.html"

# contents: write  -> 把生成的日报提交回仓库
# pages: write     -> 发布到 GitHub Pages
# id-token: write  -> deploy-pages 验证身份用
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成日报
        env:
          # Secret 名字两个都认：优先 Deepseek_Daily_Report，其次 AI_API_KEY。
          # 这样无论你把密钥存成哪个名字都能跑，不用来回改。
          AI_API_KEY: ${{ secrets.Deepseek_Daily_Report || secrets.AI_API_KEY }}
          AI_BASE_URL: https://api.deepseek.com/v1
          AI_MODEL: deepseek-chat
          # GitHub 服务器在墙外，四个源直连可达，代理必须留空
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          MAX_ITEMS_PER_SOURCE: "6"
          # 每期做几篇"全文精译 + 页边批注"（成本与长度的总开关）
          DIGEST_FULL_COUNT: "3"
          # 送进模型的正文上限（字符）。调大会更完整，也更贵
          DIGEST_BODY_LIMIT: "6000"
        run: python -m src.main

      # continue-on-error：即使这一步因为 git 冲突失败，也不影响后面的 Pages 发布。
      # 日报能不能看到是第一优先级，归档进 git 是第二优先级。
      - name: 提交结果回仓库
        continue-on-error: true
        run: |
          set -e
          git config user.name  "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add -A output state
          if git diff --cached --quiet; then
            echo "本次没有新内容，跳过提交。"
            exit 0
          fi
          git commit -m "digest: $(date -u +%Y-%m-%d)"

          # 关键：用 merge（而不是 rebase）并加 -X ours。
          # 原因：任务开始时的 checkout 可能已经过时，期间仓库被别人（比如你本地）
          # 推过新内容，直接 rebase 会撞上 add/add 冲突把任务干挂。
          # -X ours 表示"冲突时以本次刚生成的文件为准"，而本次生成的就是最新的。
          git fetch origin "${GITHUB_REF_NAME}"
          if ! git merge -X ours --no-edit "origin/${GITHUB_REF_NAME}"; then
            echo "merge 出现冲突，自动保留本次产物后继续"
            git checkout --ours output state
            git add -A output state
            git commit --no-edit
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: 准备静态站点目录
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -r output _site/output

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 发布到 Pages
        id: deploy
        uses: actions/deploy-pages@v4
