name: daily-digest

# 每天北京时间 09:00 在 GitHub 服务器上：
#   抓取 → AI 分析 → 生成 HTML 日报 → 提交回仓库 → 发布到 GitHub Pages
#
# 【需要的仓库设置】
#   1. Settings → Secrets and variables → Actions → New repository secret
#      名字 AI_API_KEY，值填你的 DeepSeek key
#   2. Settings → Actions → General → 底部 Workflow permissions
#      选 "Read and write permissions"
#   3. Settings → Pages → Source 选 "GitHub Actions"（新版界面默认就是这个）

on:
  schedule:
    - cron: "0 1 * * *"    # UTC 01:00 = 北京时间 09:00
  workflow_dispatch:

# contents: write  -> 把生成的日报提交回仓库
# pages: write     -> 发布到 GitHub Pages
# id-token: write  -> deploy-pages 验证身份用
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成日报
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: https://api.deepseek.com/v1
          AI_MODEL: deepseek-chat
          # GitHub 服务器在墙外，四个源直连可达，代理必须留空
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          MAX_ITEMS_PER_SOURCE: "6"
        run: python -m src.main

      - name: 提交结果回仓库
        run: |
          set -e
          git config user.name  "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add -A output state
          if git diff --cached --quiet; then
            echo "本次没有新内容，跳过提交。"
            exit 0
          fi
          git commit -m "digest: $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

      - name: 准备静态站点目录
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -r output _site/output

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 发布到 Pages
        id: deploy
        uses: actions/deploy-pages@v4
